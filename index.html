<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR Privado</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
      integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU"
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding: 40px 20px;
        background-color: #f8f9fa;
      }
      .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        max-width: 420px;
        margin: auto;
      }
      input[type="text"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 15px;
      }
      button {
        background-color: #1a73e8;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
      }
      button:hover {
        background-color: #1557b0;
      }
      button:disabled {
        background-color: #9fb9e8;
        cursor: not-allowed;
      }
      .field-label {
        display: block;
        text-align: left;
        font-size: 13px;
        color: #555;
        margin-bottom: 8px;
        font-weight: 600;
      }
      .length-hint {
        font-size: 12px;
        text-align: left;
        margin: -2px 0 14px;
        color: #b06000;
        display: none;
      }
      .shorten-row {
        display: flex;
        align-items: center;
        gap: 6px;
        text-align: left;
        font-size: 13px;
        color: #444;
        margin: -4px 0 10px;
      }
      #shortenStatus {
        font-size: 12px;
        text-align: left;
        margin: -4px 0 14px;
        display: none;
      }
      #shortenStatus.pending { color: #1a73e8; }
      #shortenStatus.ok { color: #1e8e3e; }
      #shortenStatus.fail { color: #b06000; }
      #shortenStatus a {
        color: inherit;
        text-decoration: underline;
        cursor: pointer;
      }
      .size-options {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
      }
      .size-option {
        flex: 1;
        padding: 10px 6px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
        color: #333;
      }
      .size-option.selected {
        border-color: #1a73e8;
        background: #e8f0fe;
        color: #1a73e8;
        font-weight: 600;
      }
      #qrWrapper {
        margin-top: 10px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
      }
      #qrcode {
        display: flex;
        justify-content: center;
      }
      #qrcode img, #qrcode canvas {
        border: 14px solid white;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      #qrInfo {
        margin-top: 14px;
        font-size: 12px;
        padding: 8px 12px;
        border-radius: 6px;
        background: #f1f3f4;
        color: #444;
        display: none;
      }
      #qrInfo.warn {
        background: #fef7e0;
        color: #8a6300;
      }
      #qrInfo.bad {
        background: #fce8e6;
        color: #a50e0e;
      }
      #downloadBtn {
        margin-top: 16px;
        background-color: #1e8e3e;
        display: none;
      }
      #downloadBtn:hover {
        background-color: #166d30;
      }
      .error-msg {
        color: #d93025;
        font-size: 13px;
        margin: -4px 0 16px;
        text-align: left;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Generador QR</h2>

      <form id="qrForm">
        <input type="text" id="url" placeholder="Pega tu enlace aquí...">
        <div class="error-msg" id="errorMsg">Ingresa un enlace o texto primero.</div>
        <div class="length-hint" id="lengthHint">Enlace largo: el QR saldrá denso.</div>

        <label class="shorten-row">
          <input type="checkbox" id="autoShorten" checked>
          <span>Acortar</span>
        </label>
        <div id="shortenStatus"></div>

        <span class="field-label">Tamaño</span>
        <div class="size-options" id="sizeOptions">
          <div class="size-option" data-size="150">Pequeño</div>
          <div class="size-option selected" data-size="280">Mediano</div>
          <div class="size-option" data-size="420">Grande</div>
        </div>

        <button type="submit">Generar QR</button>
      </form>

      <div id="qrWrapper">
        <div id="qrcode"></div>
      </div>

      <div id="qrInfo"></div>

      <button id="downloadBtn" type="button">Descargar PNG</button>
    </div>

    <script>
      var qrcode = null;
      var currentSize = 280;
      var hasGenerated = false;
      var shortenedUrl = null; // último enlace acortado con éxito, para el texto original que lo generó
      var shortenedFrom = null;
      var useOriginalInstead = false; // se activa con "original" tras un acortado exitoso
      var lastRenderedText = null; // lo que realmente quedó codificado en el QR actual

      var form = document.getElementById('qrForm');
      var submitBtn = form.querySelector('button[type="submit"]');
      var urlInput = document.getElementById('url');
      var errorMsg = document.getElementById('errorMsg');
      var lengthHint = document.getElementById('lengthHint');
      var autoShortenCheckbox = document.getElementById('autoShorten');
      var shortenStatus = document.getElementById('shortenStatus');
      var sizeOptions = document.getElementById('sizeOptions');
      var qrcodeDiv = document.getElementById('qrcode');
      var downloadBtn = document.getElementById('downloadBtn');
      var qrInfo = document.getElementById('qrInfo');

      sizeOptions.addEventListener('click', function (e) {
        var target = e.target.closest('.size-option');
        if (!target) return;
        Array.prototype.forEach.call(sizeOptions.children, function (el) {
          el.classList.remove('selected');
        });
        target.classList.add('selected');
        currentSize = parseInt(target.dataset.size, 10);
        regenerate();
      });

      function updateQrInfo(moduleCount) {
        var cls, label;
        if (moduleCount <= 25) {
          cls = '';
          label = 'Simple';
        } else if (moduleCount <= 33) {
          cls = 'warn';
          label = 'Medio';
        } else {
          cls = 'bad';
          label = 'Denso';
        }
        qrInfo.className = cls;
        qrInfo.textContent = moduleCount + '×' + moduleCount + ' módulos · ' + label;
        qrInfo.style.display = 'block';
      }

      var SHORTEN_THRESHOLD = 30;
      var isUrlLike = /^https?:\/\//i;

      // CleanURI acepta llamadas desde JavaScript del navegador (CORS habilitado),
      // así que se puede usar directo desde esta página sin servidor propio.
      // Lleva un límite de tiempo: si la red o el servicio no responden, no se
      // debe dejar al usuario esperando para siempre.
      async function shortenUrl(longUrl) {
        var controller = new AbortController();
        var timeoutId = setTimeout(function () { controller.abort(); }, 8000);
        try {
          var res = await fetch('https://cleanuri.com/api/v1/shorten', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'url=' + encodeURIComponent(longUrl),
            signal: controller.signal
          });
          var data = await res.json();
          if (!res.ok || data.error) {
            throw new Error(data.error || ('HTTP ' + res.status));
          }
          return data.result_url;
        } finally {
          clearTimeout(timeoutId);
        }
      }

      function regenerate() {
        // Re-dibuja el QR con el último texto ya resuelto (acortado u original),
        // sin volver a llamar al servicio de acortado.
        if (!hasGenerated || !lastRenderedText) return;
        renderQr(lastRenderedText);
      }

      function renderQr(text) {
        lastRenderedText = text;
        qrcodeDiv.innerHTML = '';
        qrcode = new QRCode(qrcodeDiv, {
          text: text,
          width: currentSize,
          height: currentSize,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.L
        });

        var moduleCount = 21;
        try {
          moduleCount = qrcode._oQRCode.getModuleCount();
        } catch (err) {
          /* si la librería cambia su estructura interna, se omite el dato */
        }
        updateQrInfo(moduleCount);

        hasGenerated = true;
        downloadBtn.style.display = 'block';
      }

      function useShortenedResult() {
        useOriginalInstead = false;
        shortenStatus.className = 'ok';
        shortenStatus.innerHTML =
          '<strong>' + shortenedUrl + '</strong> · <a href="#" id="useOriginalLink">original</a>';
        shortenStatus.style.display = 'block';
        document.getElementById('useOriginalLink').addEventListener('click', function (e) {
          e.preventDefault();
          useOriginalInstead = true;
          renderQr(shortenedFrom);
          shortenStatus.innerHTML = 'Usando original · <a href="#" id="useShortLink">acortado</a>';
          document.getElementById('useShortLink').addEventListener('click', function (e2) {
            e2.preventDefault();
            useOriginalInstead = false;
            renderQr(shortenedUrl);
            useShortenedResult();
          });
        });
      }

      async function generar() {
        var text = urlInput.value.trim();
        if (!text) {
          errorMsg.style.display = 'block';
          return;
        }
        errorMsg.style.display = 'none';

        // Reusa un acortado ya hecho para este mismo texto, en vez de pedirlo de nuevo.
        if (shortenedFrom === text && shortenedUrl && !useOriginalInstead) {
          renderQr(shortenedUrl);
          useShortenedResult();
          return;
        }

        var shouldShorten =
          autoShortenCheckbox.checked && isUrlLike.test(text) && text.length > SHORTEN_THRESHOLD;

        if (!shouldShorten) {
          shortenStatus.style.display = 'none';
          shortenedUrl = null;
          shortenedFrom = null;
          renderQr(text);
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Acortando...';
        shortenStatus.className = 'pending';
        shortenStatus.textContent = 'Acortando...';
        shortenStatus.style.display = 'block';

        try {
          var short = await shortenUrl(text);
          shortenedUrl = short;
          shortenedFrom = text;
          useOriginalInstead = false;
          renderQr(short);
          useShortenedResult();
        } catch (err) {
          shortenedUrl = null;
          shortenedFrom = null;
          shortenStatus.className = 'fail';
          shortenStatus.textContent = 'No se pudo acortar. Se usó el original.';
          shortenStatus.style.display = 'block';
          renderQr(text);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Generar QR';
        }
      }

      urlInput.addEventListener('input', function () {
        shortenedUrl = null;
        shortenedFrom = null;
        useOriginalInstead = false;
        shortenStatus.style.display = 'none';
        lengthHint.style.display = urlInput.value.trim().length > 60 ? 'block' : 'none';
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        generar();
      });

      function getQrSourceElement() {
        return qrcodeDiv.querySelector('img') || qrcodeDiv.querySelector('canvas');
      }

      downloadBtn.addEventListener('click', function () {
        var src = getQrSourceElement();
        if (!src) return;

        var quietZone = Math.round(currentSize * 0.12);
        var canvasSize = currentSize + quietZone * 2;
        var canvas = document.createElement('canvas');
        canvas.width = canvasSize;
        canvas.height = canvasSize;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvasSize, canvasSize);

        function triggerDownload() {
          var link = document.createElement('a');
          link.download = 'codigo-qr.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        }

        function draw(qrImg) {
          ctx.drawImage(qrImg, quietZone, quietZone, currentSize, currentSize);
          triggerDownload();
        }

        if (src.tagName === 'CANVAS') {
          draw(src);
        } else {
          var qrImg = new Image();
          qrImg.onload = function () { draw(qrImg); };
          qrImg.src = src.src;
        }
      });
    </script>
  </body>
</html>
