<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR Privado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding: 40px 20px;
        background-color: #f8f9fa;
      }
      .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        max-width: 400px;
        margin: auto;
      }
      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
      }
      button {
        background-color: #1a73e8;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
      }
      button:hover {
        background-color: #1557b0;
      }
      #qrcode {
        margin-top: 30px;
        display: flex;
        justify-content: center;
      }
      #qrcode img {
        border: 10px solid white;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Generador QR</h2>
      
      <input type="text" id="url" placeholder="Pega tu enlace de Forms aquí...">
      <button onclick="generar()">Generar QR</button>
      
      <div id="qrcode"></div>
    </div>

    <script>
      var qrcode = new QRCode(document.getElementById("qrcode"), {
        width: 250,
        height: 250,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      function generar() {
        var url = document.getElementById("url").value;
        if (!url) return;
        qrcode.makeCode(url);
      }
    </script>
  </body>
</html>
